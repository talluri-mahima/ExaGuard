[project]
name = "exaguard"
version = "0.1.0"
description = "Evidence-first financial crime topology investigations on Exasol Personal"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
